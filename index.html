<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Profil Saya</title>
    <!-- Menghubungkan file HTML ke external CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container Utama -->
    <div class="card-container">
        <!-- Foto Profil -->
        <img src="foto.jpeg" alt="Foto Diri" class="profile-img">

        <!-- Informasi Diri -->
        <h2 class="profile-name">Rizki Ramadhan</h2>
        <p class="profile-nis">NIS: 0099691780</p>

        <!-- Deskripsi Minat -->
        <p class="profile-bio">
            Saya memiliki ketertarikan tinggi pada dunia pemrograman, khususnya pengembangan web modern. Saya suka memecahkan masalah melalui logika kode dan ingin menjadi seorang Full-Stack Developer di masa depan.
        </p>

        <!-- Tautan/Tombol Media Sosial dengan Efek Hover -->
        <div class="social-links">
            <a href="https://github.com" target="_blank" class="btn">GitHub</a>
            <a href="https://instagram.com" target="_blank" class="btn">Instagram</a>
        </div>
    </div>

</body>
</html>
